name: atbrains
version: "1.1.0"
description: >-
  atbrains —— brain 记忆系统(Redis 短期 + MariaDB 长期 + Qdrant 向量)的监控与控制台。
  提供 `hermes atbrains status|serve|stop|open|drain|doctor|memories|turns|sessions|search|remember|forget|restore`
  命令行、两个 agent 工具(atbrains_status / atbrains_control),以及**按需启动**的网页控制台
  (`hermes atbrains serve`,不注册任何 systemd 服务)。
  代码的家:/root/atbrains(仓库,git 管理);用仓库根目录 install.sh 安装到 ~/.hermes/plugins/atbrains。
author: claus778
kind: standalone
platforms:
  - linux
provides_tools:
  - atbrains_status
  - atbrains_control
# 说明:本插件不声明 pip_dependencies —— 只用 stdlib 和兄弟插件 brain 的 vendor 库。
# 这是刻意的:一旦声明依赖,PM 会把插件并入 uv workspace 重解析,而国内镜像缺
# PEP 700 upload-time 元数据会让解析失败、插件被自动禁用(本机踩过这个坑)。
